name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Ruff
        run: uv run ruff check
      - name: Pyright
        run: uv run pyright

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Import smoke tests
        run: uv run pytest tests/test_import_smoke.py
      - name: Notebook compile tests
        run: uv run pytest tests/test_notebook_compile.py
      - name: Wrapper mock tests
        run: uv run pytest tests/wrapper_mocks/

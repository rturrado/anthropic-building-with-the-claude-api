[project]
name = "building-with-the-claude-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.13.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "mcp[cli]>=1.8.0,<2",
    "prompt-toolkit>=3.0.51",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "voyageai>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["chat.py", "chat_cache.py", "chat_tools.py", "files_api.py", "models.py", "tool_schemas.py"]

[dependency-groups]
dev = [
    "pyright>=1.1.396",
    "pytest>=8.3.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]
"tool_schemas.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.14"
include = ["chat.py", "chat_cache.py", "chat_tools.py", "files_api.py", "models.py", "tool_schemas.py", "tests"]
exclude = ["**/.venv", "**/__pycache__", "**/.ipynb_checkpoints", "**/*.ipynb"]
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
